name: Actualizar datos del INE

on:
  schedule:
    - cron: "17 11 * * *"   # cada día a las 11:17 UTC; solo guarda cambios si el INE ha publicado un mes nuevo
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/actualizar-datos.yml"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos del INE
        run: python scripts/actualizar_datos.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin datos nuevos"
          else
            git commit -m "Datos INE actualizados: $(python -c "import json;print(json.load(open('data/ultima_actualizacion.json'))['ultimo_mes'])")"
            git push
          fi
